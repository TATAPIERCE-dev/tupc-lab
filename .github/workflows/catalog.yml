name: Actualizar catálogo
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog.yml'
      - 'scraper/**'
      - 'requirements.txt'
permissions:
  contents: write
concurrency:
  group: catalog-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar código
        run: |
          npm run check
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -v
      - name: Recolectar precios
        id: scrape
        continue-on-error: true
        run: python -m scraper.collect
      - name: Publicar captura completa o parcial
        run: |
          python scripts/validate_catalog.py
          git add dist/data/catalog.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar precios del catálogo'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Señalar fuentes con errores
        if: steps.scrape.outcome == 'failure'
        run: |
          echo 'El recolector falló o alguna fuente no respondió. Revisar logs y fechas de lectura.'
          exit 1
